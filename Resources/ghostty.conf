# Ghostty configuration bundled with Cliamp. Any option that libghostty itself
# implements is valid (https://ghostty.org/docs/config/reference); `command`
# and `initial-command` are managed by the wrapper.
#
# Per-user overrides: ~/.config/cliamp-wrapper/ghostty.conf

# libghostty keeps the surface open after cliamp exits (forced for surface
# commands). The wrapper quits immediately on a clean (status 0) exit and
# shows a banner otherwise.
abnormal-command-exit-runtime = 250

# cliamp is a single program, not a shell.
shell-integration = none
scrollback-limit-bytes = 0

# The wrapper refuses every clipboard request that would need a confirmation
# dialog, so keep these definite: allow/deny, true/false, never `ask`.
clipboard-read = deny
clipboard-write = allow
clipboard-paste-protection = false

# Look and feel
font-size = 13
window-padding-x = 8
window-padding-y = 8
window-padding-balance = true
cursor-style = block
cursor-style-blink = false
mouse-hide-while-typing = true
macos-option-as-alt = true

# Drop every default Ghostty keybind (tabs, splits, etc.) so cliamp sees
# all keys. Copy, paste, select all and font size are menu items instead.
keybind = clear
